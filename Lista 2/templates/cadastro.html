<!DOCTYPE html>
<html lang="PT-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulário</title>
</head>
<body>
	<h2>Cadastro de Usuário</h2>

	<form action="{{ url_for('exibir_resultado') }}" method="POST">
		<div>
			<label>Nome:</label>
			<input type="text" name="nome_user">
		</div>

		<br>

		<div>
			<label>Idade:</label>
			<input type="number" name="idade_user">
		</div>

		<br>

		<div>
			<label>Curso:</label>
			<input type="text" name="curso_user">
		</div>

		<br>

		<button type="submit">Confirmar</button>
	</form>
</body>
</html>
